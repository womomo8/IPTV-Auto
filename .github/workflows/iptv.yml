
name: IPTV Auto Update

on:
  schedule:
    - cron: "0 22 * * *"

  workflow_dispatch:
    inputs:
      run_mode:
        description: "选择运行模式"
        required: true
        type: choice
        default: formal
        options:
          - formal
          - test

permissions:
  contents: read

concurrency:
  group: iptv-auto-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    if: >-
      github.event_name == 'workflow_dispatch' &&
      inputs.run_mode == 'test'
    runs-on: ubuntu-latest
    timeout-minutes: 22
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install aiohttp

      - name: Run IPTV test mode
        run: python main.py --mode test

  formal:
    if: >-
      github.event_name == 'schedule' ||
      (
        github.event_name == 'workflow_dispatch' &&
        inputs.run_mode == 'formal'
      )
    runs-on: ubuntu-latest
    timeout-minutes: 22
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Configure Git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install aiohttp

      - name: Run IPTV formal mode
        run: python main.py --mode formal
